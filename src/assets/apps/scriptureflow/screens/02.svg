<svg xmlns="http://www.w3.org/2000/svg" width="390" height="824" viewBox="0 0 390 824" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="390" height="824" fill="#09090B"/>
  <text x="26" y="40" fill="#A1A1AA" font-size="13" font-weight="600">9:41</text>
  <rect x="318" y="30" width="22" height="11" rx="3" fill="none" stroke="#52525B"/>
  <rect x="320" y="32" width="15" height="7" rx="1.5" fill="#A1A1AA"/>

  <!-- sheet header -->
  <rect x="0" y="64" width="390" height="760" rx="28" fill="#131315"/>
  <rect x="171" y="80" width="48" height="4" rx="2" fill="#3F3F46"/>
  <text x="26" y="122" fill="#71717A" font-size="10.5" letter-spacing="2" font-weight="600">WORD ROOT</text>

  <text x="26" y="164" fill="#FAFAFA" font-size="30" font-weight="600">φῶς</text>
  <text x="112" y="164" fill="#D4AF37" font-size="15">phōs</text>
  <text x="26" y="190" fill="#71717A" font-size="12.5">Greek · noun · Strong's G5457</text>

  <rect x="26" y="212" width="338" height="1" fill="#212124"/>

  <text x="26" y="244" fill="#A1A1AA" font-size="10.5" letter-spacing="1.8" font-weight="600">MEANING</text>
  <text fill="#D4D4D8" font-size="14">
    <tspan x="26" y="272">Light — not a lamp but the thing a lamp</tspan>
    <tspan x="26" y="294">gives off. Used of daylight, of fire, and</tspan>
    <tspan x="26" y="316">of what makes a thing able to be seen.</tspan>
  </text>

  <text x="26" y="358" fill="#A1A1AA" font-size="10.5" letter-spacing="1.8" font-weight="600">WHERE IT WAS WRITTEN</text>
  <text fill="#D4D4D8" font-size="14">
    <tspan x="26" y="386">First-century Greek readers heard an</tspan>
    <tspan x="26" y="408">everyday word here, not a religious one.</tspan>
  </text>

  <text x="26" y="452" fill="#A1A1AA" font-size="10.5" letter-spacing="1.8" font-weight="600">APPEARS IN 72 PLACES</text>

  <g>
    <rect x="26" y="470" width="338" height="66" rx="14" fill="#18181B"/>
    <text x="42" y="496" fill="#D4AF37" font-size="11.5" font-weight="600">Matthew 5:14</text>
    <text x="42" y="518" fill="#A1A1AA" font-size="12.5">You are the light of the world.</text>

    <rect x="26" y="546" width="338" height="66" rx="14" fill="#18181B"/>
    <text x="42" y="572" fill="#D4AF37" font-size="11.5" font-weight="600">John 8:12</text>
    <text x="42" y="594" fill="#A1A1AA" font-size="12.5">I am the light of the world.</text>

    <rect x="26" y="622" width="338" height="66" rx="14" fill="#18181B"/>
    <text x="42" y="648" fill="#D4AF37" font-size="11.5" font-weight="600">1 John 1:5</text>
    <text x="42" y="670" fill="#A1A1AA" font-size="12.5">God is light; in him is no darkness.</text>
  </g>

  <rect x="26" y="712" width="338" height="48" rx="24" fill="#D4AF37"/>
  <text x="195" y="742" fill="#18120A" font-size="14" font-weight="600" text-anchor="middle">Save to notes</text>
</svg>
