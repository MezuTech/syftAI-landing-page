name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Needed by deploy-pages: read the repo, publish the artifact, and mint the
# OIDC token Pages uses to verify the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do let a newer push wait rather than
# cancel — a half-deployed site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
