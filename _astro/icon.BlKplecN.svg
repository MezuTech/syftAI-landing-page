<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="LoveStory">
  <title>LoveStory</title>
  <defs>
    <!-- Right page: the lit side of the book -->
    <linearGradient id="pageLit" x1="50" y1="7" x2="94" y2="88.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="0.55" stop-color="#FF5A3C"/>
      <stop offset="1" stop-color="#EE3330"/>
    </linearGradient>
    <!-- Left page: turned away from the light, so a deeper pink -->
    <linearGradient id="pageShade" x1="6" y1="7" x2="50" y2="88.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4D8D"/>
      <stop offset="0.55" stop-color="#E91E63"/>
      <stop offset="1" stop-color="#BE1259"/>
    </linearGradient>
    <!-- Gutter shading: pages darken as they fall into the spine -->
    <linearGradient id="gutterLeft" x1="33" y1="0" x2="48.5" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="gutterRight" x1="67" y1="0" x2="51.5" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="clipLeft">
      <path d="M47.4 20.5 C43.8 13 38.3 6.5 30.3 6.5 C17.3 6.5 5.5 16.8 5.5 33.4 C5.5 52.4 27.5 72.5 49.1 90 Q47.6 55 47.4 20.5 Z"/>
    </clipPath>
    <clipPath id="clipRight">
      <path d="M52.6 20.5 C56.2 13 61.7 6.5 69.7 6.5 C82.7 6.5 94.5 16.8 94.5 33.4 C94.5 52.4 72.5 72.5 50.9 90 Q52.4 55 52.6 20.5 Z"/>
    </clipPath>
  </defs>

  <!-- Two open pages whose outer edges close into a heart; the gap between them is the spine -->
  <g clip-path="url(#clipLeft)">
    <path d="M47.4 20.5 C43.8 13 38.3 6.5 30.3 6.5 C17.3 6.5 5.5 16.8 5.5 33.4 C5.5 52.4 27.5 72.5 49.1 90 Q47.6 55 47.4 20.5 Z" fill="url(#pageShade)"/>
    <rect x="5" y="0" width="45" height="100" fill="url(#gutterLeft)"/>
  </g>
  <g clip-path="url(#clipRight)">
    <path d="M52.6 20.5 C56.2 13 61.7 6.5 69.7 6.5 C82.7 6.5 94.5 16.8 94.5 33.4 C94.5 52.4 72.5 72.5 50.9 90 Q52.4 55 52.6 20.5 Z" fill="url(#pageLit)"/>
    <rect x="50" y="0" width="45" height="100" fill="url(#gutterRight)"/>
  </g>

  <!-- Lines of text, drooping into the gutter the way a real open page does -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <path d="M15.5 29 Q29 29.5 42 34.5"/>
    <path d="M15 41 Q28.5 41.5 42 46.5"/>
    <path d="M22 54 Q31 54 40 57.5"/>
    <path d="M84.5 29 Q71 29.5 58 34.5"/>
    <path d="M85 41 Q71.5 41.5 58 46.5"/>
    <path d="M78 54 Q69 54 60 57.5"/>
  </g>
</svg>
