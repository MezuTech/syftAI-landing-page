  <text x="26" y="158" fill="#E91E63" font-size="10.5" letter-spacing="2.4" font-weight="600">CHAPTER THREE</text>
  <text x="26" y="196" fill="#F2F5F9" font-size="24" font-weight="700">The Late Shift</text>

  <text fill="#E4E8EE" font-size="14.5">
    <tspan x="26" y="248">The office was empty except for the hum</tspan>
    <tspan x="26" y="274">of the vending machine and Adaeze, who</tspan>
    <tspan x="26" y="300">had not looked up from her screen in an</tspan>
    <tspan x="26" y="326">hour and had no intention of starting now.</tspan>
    <tspan x="26" y="366">"You're in my chair," she said.</tspan>
    <tspan x="26" y="406">Tobi did not move. He had been in that</tspan>
    <tspan x="26" y="432">chair for twenty minutes, and they both</tspan>
    <tspan x="26" y="458">knew the rota said it was his until nine.</tspan>
    <tspan x="26" y="498">"The rota," he said, "is a suggestion."</tspan>
    <tspan x="26" y="538">She turned then — properly, for the first</tspan>
    <tspan x="26" y="564">time all evening — and he wished she</tspan>
    <tspan x="26" y="590">hadn't, because whatever he had been</tspan>
    <tspan x="26" y="616">planning to say next left him entirely.</tspan>
  </text>

